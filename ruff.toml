# Match Black's default formatting width.
line-length = 88
target-version = "py310"

[lint]
# Flake8's Pyflakes/pycodestyle checks and isort's import sorting.
select = ["E", "F", "W", "I"]
# E203 was ignored by Flake8; W503 has no Ruff equivalent.
# E501 uses the separate lint limit below, rather than the formatting width.
ignore = ["E203"]

[lint.pycodestyle]
max-line-length = 250
