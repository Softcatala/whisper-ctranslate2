name: Publish to GitHub Container Registry

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Build Docker image
      run: docker build -t ghcr.io/softcatala/whisper-ctranslate2:latest .

    - name: Test Docker image
      run: |
        mkdir -p "$RUNNER_TEMP/docker-output"
        docker run --rm --network none -v "$PWD":/srv/files:ro -v "$RUNNER_TEMP/docker-output":/output ghcr.io/softcatala/whisper-ctranslate2:latest /srv/files/e2e-tests/gossos.mp3 --device cpu --compute_type float32 --local_files_only True --output_format txt --output_dir /output
        diff e2e-tests/ref-small-transcribe/gossos.txt "$RUNNER_TEMP/docker-output/gossos.txt"

    - name: Push Docker image
      run: docker push ghcr.io/softcatala/whisper-ctranslate2:latest

    # These are untagged images left behind in the Docker public registry      
    - name: Delete old images
      run: |
       gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
       gh api -X GET /user/packages/container/whisper-ctranslate2/versions \
        | jq -r '.[] | select(.metadata.container.tags | index("latest") | not) | .id' \
        | xargs -I {} gh api -X DELETE /user/packages/container/whisper-ctranslate2/versions/{}

  test-published-image:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Pull published Docker image
      run: docker pull ghcr.io/softcatala/whisper-ctranslate2:latest

    - name: Test Docker image
      run: |
        mkdir -p "$RUNNER_TEMP/docker-output"
        docker run --rm --network none -v "$PWD":/srv/files:ro -v "$RUNNER_TEMP/docker-output":/output ghcr.io/softcatala/whisper-ctranslate2:latest /srv/files/e2e-tests/gossos.mp3 --device cpu --compute_type float32 --local_files_only True --output_format txt --output_dir /output
        diff e2e-tests/ref-small-transcribe/gossos.txt "$RUNNER_TEMP/docker-output/gossos.txt"
